[package]
name = "kde-material-you-colors"
version = "2.2.0"
edition = "2021"
description = "Material You color generator and theme applicator for KDE Plasma 6 written in Rust"
license = "GPL-3.0-or-later"

[lib]
name = "kde_material_you_colors"
path = "src/lib.rs"

[[bin]]
name = "kde-material-you-colors"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico", "tiff"] }
ksni = "0.2"
material-colors = { version = "0.4", features = ["image"] }
notify = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.5", default-features = false, features = ["tokio"] }
iced = { version = "0.13", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.16"
